
<meta charset="UTF-8">
<div style="max-width: 1400px; margin: 0 auto;">
<div style="display: flex; gap: 24px; width: 100%;">
  <div style="position: relative; flex: 1; height: 420px;">
    <canvas id="chartDist"></canvas>
  </div>
  <div style="position: relative; flex: 1; height: 420px;">
    <canvas id="chartLen"></canvas>
  </div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 8px; font-size: 13px; color: #555;">
  <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #9DD4A5;"></span>SRAM-v1.0-30B (pre-RL)</span>
  <span style="display: flex; align-items: center; gap: 5px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #4A9E5C;"></span>SRAM-v1.0-30B (post-RL)</span>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
const gridColor = 'rgba(0,0,0,0.08)';
const textColor = '#222';
const preRL = '#9DD4A5';
const postRL = '#4A9E5C';

function zeroArray(len) {
  return Array.from({ length: len }, () => 0);
}

function animateBarsAfterDelay(chart, targetDatasets, delayMs) {
  setTimeout(function() {
    chart.data.datasets.forEach(function(ds, i) {
      ds.data = targetDatasets[i].slice();
    });
    chart.options.animation = { duration: 1000, easing: 'easeOutQuart' };
    chart.update();
  }, delayMs);
}

const distTargets = [
  [15.6, 36.6, 42.5, 3.2, 1.4, 0.7],
  [13.6, 18.3, 53.2, 9.7, 3.6, 1.6]
];

const distChart = new Chart(document.getElementById('chartDist'), {
  type: 'bar',
  data: {
    labels: ['0', '1', '2', '3', '4', '5+'],
    datasets: [
      { label: 'pre-RL', data: zeroArray(6), backgroundColor: preRL, borderRadius: 2, barPercentage: 0.85, categoryPercentage: 0.7 },
      { label: 'post-RL', data: zeroArray(6), backgroundColor: postRL, borderRadius: 2, barPercentage: 0.85, categoryPercentage: 0.7 }
    ]
  },
  options: {
    animation: false,
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 14 } },
    plugins: {
      legend: { display: false },
      title: { display: true, text: 'Plan Step Distribution (% of Turns)', color: textColor, font: { size: 14, weight: '500' }, padding: { bottom: 4 } },
      datalabels: {
        anchor: 'end', align: 'end', color: textColor,
        font: { size: 9, weight: '500' },
        formatter: v => v >= 1 ? v.toFixed(1) : ''
      }
    },
    scales: {
      x: { title: { display: true, text: '# Plan Steps', color: textColor, font: { size: 11 } }, grid: { display: false }, ticks: { color: textColor, font: { size: 10 } } },
      y: { title: { display: true, text: '% of Turns', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 }, callback: v => v + '%' }, min: 0, max: 60 }
    }
  }
});

const lenTargets = [
  [1.91, 1.62, 1.73, 1.63, 1.67],
  [2.32, 2.15, 2.21, 1.97, 2.05]
];

const lenChart = new Chart(document.getElementById('chartLen'), {
  type: 'bar',
  data: {
    labels: ['Math', 'Science', 'Tabular', 'Web', 'Overall'],
    datasets: [
      { label: 'pre-RL', data: zeroArray(5), backgroundColor: preRL, borderRadius: 2, barPercentage: 0.8, categoryPercentage: 0.65 },
      { label: 'post-RL', data: zeroArray(5), backgroundColor: postRL, borderRadius: 2, barPercentage: 0.8, categoryPercentage: 0.65 }
    ]
  },
  options: {
    animation: false,
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 14 } },
    plugins: {
      legend: { display: false },
      title: { display: true, text: 'Avg. Plan Length by Category', color: textColor, font: { size: 14, weight: '500' }, padding: { bottom: 4 } },
      datalabels: {
        anchor: 'end', align: 'end', color: textColor,
        font: { size: 9, weight: '500' },
        formatter: v => v.toFixed(2)
      }
    },
    scales: {
      x: { title: { display: true, text: 'Task Category', color: textColor, font: { size: 11 } }, grid: { display: false }, ticks: { color: textColor, font: { size: 10 } } },
      y: { title: { display: true, text: 'Avg. Steps (Cond.)', color: textColor, font: { size: 11 } }, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } }, min: 0, max: 2.7 }
    }
  }
});

function replayAnimation() {
  [distChart, lenChart].forEach(function(chart) {
    chart.data.datasets.forEach(function(ds) {
      ds.data = ds.data.map(function() { return 0; });
    });
    chart.options.animation = false;
    chart.update('none');
  });
  animateBarsAfterDelay(distChart, distTargets, 250);
  animateBarsAfterDelay(lenChart, lenTargets, 250);
}

replayAnimation();

window.addEventListener('message', function(e) {
  if (e.data === 'replayAnimation') replayAnimation();
});
</script>
