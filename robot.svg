<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Left ear bump -->
  <rect x="16" y="1" width="17" height="26" rx="5" fill="#45C9B6"/>
  <rect x="20" y="5"  width="9"  height="15" rx="2" fill="white"/>

  <!-- Right ear bump -->
  <rect x="67" y="1" width="17" height="26" rx="5" fill="#45C9B6"/>
  <rect x="71" y="5"  width="9"  height="15" rx="2" fill="white"/>

  <!-- Bridge bar connecting ears -->
  <rect x="30" y="7" width="40" height="11" fill="#45C9B6"/>

  <!-- Head outer -->
  <rect x="7" y="16" width="86" height="73" rx="13" fill="#45C9B6"/>

  <!-- Head face (white interior) -->
  <rect x="14" y="23" width="72" height="60" rx="8" fill="white"/>

  <!-- Left eye (pixel circle) -->
  <rect x="22" y="31" width="22" height="22" rx="11" fill="#45C9B6"/>
  <!-- Left eye highlight -->
  <rect x="25" y="34" width="5" height="5" fill="white"/>

  <!-- Right eye (pixel circle) -->
  <rect x="56" y="31" width="22" height="22" rx="11" fill="#45C9B6"/>
  <!-- Right eye highlight -->
  <rect x="59" y="34" width="5" height="5" fill="white"/>

  <!-- Mouth outer -->
  <rect x="19" y="61" width="62" height="18" rx="4" fill="#45C9B6"/>
  <!-- Mouth white interior -->
  <rect x="24" y="65" width="52" height="11" fill="white"/>
  <!-- Teeth (4 downward posts from top of mouth) -->
  <rect x="28" y="65" width="7" height="7" fill="#45C9B6"/>
  <rect x="40" y="65" width="7" height="7" fill="#45C9B6"/>
  <rect x="52" y="65" width="7" height="7" fill="#45C9B6"/>
  <rect x="64" y="65" width="7" height="7" fill="#45C9B6"/>
</svg>
