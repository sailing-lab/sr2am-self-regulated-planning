    function copyBibtex() {
      const text = document.getElementById('bibtex-text').innerText;
      navigator.clipboard.writeText(text).then(() => {

        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    }
