<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; font-family: 'DM Sans', sans-serif; }
</style>
</head>
<body>
<script>
// ── Data (identical to JSX) ──────────────────────────────────────────────────
const data = [
  { name: "Kimi-K2.5", params: 1024, overall: 70.89, tokens: 6413.1, category: "tools" },
  { name: "DeepSeek-V3.2", params: 685, overall: 73.16, tokens: 3011.5, category: "tools" },
  { name: "GLM-4.6", params: 357, overall: 60.69, tokens: 3580.4, category: "tools" },
  { name: "Qwen3-235B-A22B-Thinking-2507", params: 235, overall: 57.00, tokens: 6467.4, category: "tools" },
  { name: "GPT-OSS-120B-high", params: 120, overall: 60.31, tokens: 2700.4, category: "tools" },
  { name: "Qwen3-30B-A3B-Thinking-2507", params: 30, overall: 53.12, tokens: 5410.1, category: "tools" },
  { name: "Qwen3-8B", params: 8, overall: 46.47, tokens: 3932.5, category: "tools" },
  { name: "Tongyi-DeepResearch", params: 30, overall: 60.64, tokens: 7431.8, category: "blackbox" },
  { name: "MiroThinker-v1.5-30B", params: 30, overall: 74.21, tokens: 11295.2, category: "blackbox" },
  { name: "WebSailor-32B", params: 32, overall: 51.85, tokens: 1055.2, category: "blackbox" },
  { name: "WebSailor-7B", params: 7, overall: 32.76, tokens: 2211.5, category: "blackbox" },
  { name: "ASearcher-Web-QWQ-v2", params: 32, overall: 59.25, tokens: 116752.9, category: "blackbox" },
  { name: "ASearcher-Web-7B", params: 7, overall: 24.46, tokens: 601.4, category: "blackbox" },
  { name: "WebExplorer-8B", params: 8, overall: 54.66, tokens: 3616.9, category: "blackbox" },
  { name: "SimpleTIR-32B", params: 32, overall: 38.63, tokens: 5174.8, category: "blackbox" },
  { name: "SimpleTIR-7B", params: 7, overall: 30.85, tokens: 3551.7, category: "blackbox" },
  { name: "A2FM", params: 32, overall: 51.39, tokens: 23424.8, category: "adaptive" },
  { name: "AFM-Web-7B-RL", params: 7, overall: 27.46, tokens: 2608.6, category: "adaptive" },
  { name: "AFM-Code-7B-RL", params: 7, overall: 28.92, tokens: 11205.5, category: "adaptive" },
  { name: "SRAM-v1.0-30B", params: 30, overall: 71.33, tokens: 5517.7, category: "self" },
  { name: "SRAM-v0.1-8B", params: 8, overall: 56.98, tokens: 3697.6, category: "self" },
  { name: "DeepSeek-V3.2 (text-only)", params: 685, overall: 62.80, tokens: 9306.2, category: "textonly" },
  { name: "Qwen3-30B-A3B-Thinking-2507 (text-only)", params: 30, overall: 52.63, tokens: 8269.1, category: "textonly" },
  { name: "K2-Think-V2-high (text-only)", params: 73, overall: 55.29, tokens: 31905.2, category: "textonly" },
];

const tokenBins = [
  { label: "<3K", max: 3000, color: "#1e9e6d" },
  { label: "3K\u20136K", max: 6000, color: "#6ec07a" },
  { label: "6K\u20139K", max: 9000, color: "#e4b832" },
  { label: ">9K", max: Infinity, color: "#c43e3e" },
];
function tokenColor(t) { for (const b of tokenBins) if (t < b.max) return b.color; return tokenBins[3].color; }

data.forEach(d => {
  d.logp = Math.log10(d.params);
  d.color = tokenColor(d.tokens);
});

// Regression
const xs = data.map(d => d.logp), ys = data.map(d => d.overall), n = xs.length;
const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
const ssXX = xs.reduce((s,x)=>s+(x-mx)**2,0), ssXY = xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0);
const slope = ssXY/ssXX, intercept = my - slope*mx;
const residuals = ys.map((y,i)=>y-(slope*xs[i]+intercept));
const stdDev = Math.sqrt(residuals.reduce((s,r)=>s+r*r,0)/(n-2));

// Layout constants — match Recharts ResponsiveContainer at ~1020px wide, 400px tall
const W = 1020, H = 400;
const margin = { top: 16, right: 40, bottom: 36, left: 24 };
// Recharts adds ~40px for Y-axis labels and ~20px for X-axis labels; approximate:
const plotL = margin.left + 52, plotR = W - margin.right;
const plotT = margin.top, plotB = H - margin.bottom - 8;
const plotW = plotR - plotL, plotH = plotB - plotT;

const logMin = 0.35, logMax = 3.5;
const yMin = 15, yMax = 85;

function toX(v) { return plotL + ((v - logMin) / (logMax - logMin)) * plotW; }
function toY(v) { return plotB - ((v - yMin) / (yMax - yMin)) * plotH; }

// Marker paths
function squarePath(cx,cy,s) { return `M${cx-s},${cy-s}L${cx+s},${cy-s}L${cx+s},${cy+s}L${cx-s},${cy+s}Z`; }
function trianglePath(cx,cy,s) { const h=s*1.15; return `M${cx},${cy-h}L${cx+s},${cy+h*0.6}L${cx-s},${cy+h*0.6}Z`; }
function diamondPath(cx,cy,s) { const h=s*1.2; return `M${cx},${cy-h}L${cx+s},${cy}L${cx},${cy+h}L${cx-s},${cy}Z`; }
function hexagonPath(cx,cy,s) { const pts=[]; for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/2;pts.push(`${cx+s*Math.cos(a)},${cy+s*Math.sin(a)}`);}return `M${pts.join("L")}Z`; }

const labelOffsets = {
  "Kimi-K2.5": {dx:14,dy:0,anchor:"start"},
  "DeepSeek-V3.2": {dx:14,dy:-10,anchor:"start"},
  "GLM-4.6": {dx:0,dy:-16,anchor:"middle"},
  "Qwen3-235B-A22B-Thinking-2507": {dx:14,dy:0,anchor:"start"},
  "GPT-OSS-120B-high": {dx:0,dy:-16,anchor:"middle"},
  "Qwen3-30B-A3B-Thinking-2507": {dx:0,dy:-16,anchor:"middle"},
  "Tongyi-DeepResearch": {dx:0,dy:-16,anchor:"middle"},
  "MiroThinker-v1.5-30B": {dx:14,dy:-8,anchor:"start"},
  "WebSailor-7B": {dx:14,dy:-2,anchor:"start"},
  "WebSailor-32B": {dx:14,dy:14,anchor:"start"},
  "ASearcher-Web-QWQ-v2": {dx:0,dy:16,anchor:"middle"},
  "ASearcher-Web-7B": {dx:14,dy:0,anchor:"start"},
  "WebExplorer-8B": {dx:0,dy:16,anchor:"middle"},
  "SimpleTIR-32B": {dx:14,dy:0,anchor:"start"},
  "SimpleTIR-7B": {dx:14,dy:2,anchor:"start"},
  "A2FM": {dx:0,dy:16,anchor:"middle"},
  "AFM-Web-7B-RL": {dx:-14,dy:3,anchor:"end"},
  "AFM-Code-7B-RL": {dx:-14,dy:-3,anchor:"end"},
  "SRAM-v1.0-30B": {dx:14,dy:2,anchor:"start"},
  "Qwen3-8B": {dx:0,dy:16,anchor:"middle"},
  "SRAM-v0.1-8B": {dx:0,dy:-18,anchor:"middle"},
  "DeepSeek-V3.2 (text-only)": {dx:14,dy:0,anchor:"start"},
  "Qwen3-30B-A3B-Thinking-2507 (text-only)": {dx:-14,dy:0,anchor:"end"},
  "K2-Think-V2-high (text-only)": {dx:14,dy:0,anchor:"start"},
};

const zoomModelNames = new Set([
  "Qwen3-30B-A3B-Thinking-2507","Qwen3-30B-A3B-Thinking-2507 (text-only)","A2FM","WebSailor-32B"
]);

const zoomOffsets = {
  "Qwen3-30B-A3B-Thinking-2507 (text-only)": {dx:-10,dy:0,anchor:"end"},
  "Qwen3-30B-A3B-Thinking-2507": {dx:0,dy:-14,anchor:"middle"},
  "A2FM": {dx:0,dy:16,anchor:"middle"},
  "WebSailor-32B": {dx:10,dy:0,anchor:"start"},
};

// ── Build SVG ────────────────────────────────────────────────────────────────
let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="font-family:'DM Sans',sans-serif;overflow:visible;">`;

// Grid lines (dashed)
const hTicks = [20,30,40,50,60,70,80];
const vTicks = [1,2,3];
hTicks.forEach(v => {
  svg += `<line x1="${plotL}" x2="${plotR}" y1="${toY(v)}" y2="${toY(v)}" stroke="rgba(0,0,0,0.08)" stroke-dasharray="3 6"/>`;
});
vTicks.forEach(v => {
  svg += `<line x1="${toX(v)}" x2="${toX(v)}" y1="${plotT}" y2="${plotB}" stroke="rgba(0,0,0,0.08)" stroke-dasharray="3 6"/>`;
});
// Borders: left+bottom solid, top+right dashed
svg += `<line x1="${plotL}" x2="${plotR}" y1="${plotB}" y2="${plotB}" stroke="rgba(0,0,0,0.15)"/>`;
svg += `<line x1="${plotL}" x2="${plotL}" y1="${plotT}" y2="${plotB}" stroke="rgba(0,0,0,0.15)"/>`;
svg += `<line x1="${plotR}" x2="${plotR}" y1="${plotT}" y2="${plotB}" stroke="rgba(0,0,0,0.08)" stroke-dasharray="3 6"/>`;
svg += `<line x1="${plotL}" x2="${plotR}" y1="${plotT}" y2="${plotT}" stroke="rgba(0,0,0,0.08)" stroke-dasharray="3 6"/>`;

// X-axis ticks + labels
const tickLabelMap = {1:"10B",2:"100B",3:"1T"};
vTicks.forEach(v => {
  const x = toX(v);
  svg += `<line x1="${x}" x2="${x}" y1="${plotB}" y2="${plotB+5}" stroke="rgba(0,0,0,0.1)"/>`;
  svg += `<text x="${x}" y="${plotB+20}" text-anchor="middle" fill="#3a4a5e" font-size="14" font-weight="600" font-family="'JetBrains Mono',monospace">${tickLabelMap[v]}</text>`;
});
svg += `<text x="${(plotL+plotR)/2}" y="${plotB+36}" text-anchor="middle" fill="#4a5a6e" font-size="14" font-weight="600">Parameter Size (log scale)</text>`;

// Y-axis ticks + labels
hTicks.forEach(v => {
  const y = toY(v);
  svg += `<line x1="${plotL-5}" x2="${plotL}" y1="${y}" y2="${y}" stroke="rgba(0,0,0,0.1)"/>`;
  svg += `<text x="${plotL-10}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="#3a4a5e" font-size="14" font-weight="600" font-family="'JetBrains Mono',monospace">${v}</text>`;
});
// Y-axis label (rotated)
const yLabelY = (plotT+plotB)/2;
svg += `<text x="${plotL-48}" y="${yLabelY}" text-anchor="middle" dominant-baseline="middle" fill="#4a5a6e" font-size="14" font-weight="600" transform="rotate(-90,${plotL-48},${yLabelY})">Overall Pass@1</text>`;

// ── Regression band + line ───────────────────────────────────────────────────
const steps = 80;
let bandUp = [], bandDown = [], regPts = [];
for (let i = 0; i <= steps; i++) {
  const xv = logMin + (i/steps)*(logMax-logMin);
  const yv = slope*xv + intercept;
  const px = toX(xv), py = toY(yv);
  const pyU = toY(Math.min(yv+stdDev, yMax));
  const pyD = toY(Math.max(yv-stdDev, yMin));
  regPts.push(`${px},${py}`);
  bandUp.push(`${px},${pyU}`);
  bandDown.push(`${px},${pyD}`);
}
svg += `<path d="M${bandUp.join(" L")} L${bandDown.reverse().join(" L")} Z" fill="rgba(100,130,180,0.1)" stroke="none"/>`;
svg += `<polyline points="${regPts.join(" ")}" fill="none" stroke="rgba(80,110,160,0.4)" stroke-width="2"/>`;
svg += `<text x="${toX(logMax) - 4}" y="${toY(85) + 14}" text-anchor="end" fill="#5a6a7e" font-size="11" font-weight="600">Overall Pass@1 vs. log(Parameter Size) trendline (±1σ)</text>`;

// ── gpt-5.4-xhigh reference lines ───────────────────────────────────────────
const gptTools = 78.26, gptLLM = 68.42;
svg += `<line x1="${plotL}" x2="${plotR}" y1="${toY(gptTools)}" y2="${toY(gptTools)}" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>`;
svg += `<text x="${plotL+4}" y="${toY(gptTools)-8}" text-anchor="start" fill="#cc3333" font-size="11" font-weight="600">GPT-5.4-xhigh (LLM + Tools)</text>`;
svg += `<line x1="${plotL}" x2="${plotR}" y1="${toY(gptLLM)}" y2="${toY(gptLLM)}" stroke="#dd8822" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>`;
svg += `<text x="${plotL+4}" y="${toY(gptLLM)-8}" text-anchor="start" fill="#dd8822" font-size="11" font-weight="600">GPT-5.4-xhigh (Reasoning LLM)</text>`;

// ── Scatter markers + labels ─────────────────────────────────────────────────
data.forEach(d => {
  const cx = toX(d.logp), cy = toY(d.overall);
  const isSRAM = d.name.startsWith("SRAM");
  const s = isSRAM ? 8 : 6.5;
  let marker;
  if (d.category === "textonly") {
    marker = `<circle cx="${cx}" cy="${cy}" r="${s}" fill="${d.color}" stroke="rgba(0,0,0,0.2)" stroke-width="1" opacity="0.8"/>`;
  } else if (d.category === "blackbox") {
    marker = `<path d="${trianglePath(cx,cy,s)}" fill="${d.color}" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-linejoin="round" opacity="0.92"/>`;
  } else if (d.category === "adaptive") {
    marker = `<path d="${diamondPath(cx,cy,s)}" fill="${d.color}" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-linejoin="round" opacity="0.92"/>`;
  } else if (d.category === "self") {
    marker = `<path d="${hexagonPath(cx,cy,s)}" fill="${d.color}" stroke="#1a1a2e" stroke-width="2.5" stroke-linejoin="round" opacity="0.92"/>`;
  } else {
    marker = `<path d="${squarePath(cx,cy,s)}" fill="${d.color}" stroke="rgba(0,0,0,0.15)" stroke-width="1" opacity="0.92"/>`;
  }
  svg += marker;

  if (!zoomModelNames.has(d.name)) {
    const off = labelOffsets[d.name] || {dx:14,dy:0,anchor:"start"};
    const displayName = d.name.replace(" (text-only)","");
    const fc = isSRAM ? "#1a1a2e" : "#3a4a5e";
    const fs = isSRAM ? 14 : 12;
    const fw = isSRAM ? 800 : 600;
    svg += `<text x="${cx+off.dx}" y="${cy+off.dy}" text-anchor="${off.anchor}" dominant-baseline="middle" fill="${fc}" font-size="${fs}" font-weight="${fw}">${displayName}</text>`;
  }
});

// ── Zoom inset ───────────────────────────────────────────────────────────────
const srcLogMin=1.42, srcLogMax=1.55, srcYMin=49.5, srcYMax=55;
const sx1=toX(srcLogMin), sx2=toX(srcLogMax), sy1=toY(srcYMax), sy2=toY(srcYMin);

const legendW=220, insetW=145, insetH=110;
const insetX = toX(logMax) - legendW - insetW - 72;
const insetY = toY(15) - insetH - 18;

// Dashed rect on main
svg += `<rect x="${sx1}" y="${sy1}" width="${sx2-sx1}" height="${sy2-sy1}" fill="none" stroke="#7088a8" stroke-width="1" stroke-dasharray="4 3" rx="2"/>`;
// Connectors
svg += `<line x1="${sx2}" y1="${sy1}" x2="${insetX}" y2="${insetY}" stroke="#7088a8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>`;
svg += `<line x1="${sx2}" y1="${sy2}" x2="${insetX}" y2="${insetY+insetH}" stroke="#7088a8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>`;
// Inset bg
svg += `<rect x="${insetX}" y="${insetY}" width="${insetW}" height="${insetH}" fill="rgba(248,249,252,0.95)" stroke="#7088a8" stroke-width="1" rx="4"/>`;

// Inset gridlines
const pad=20;
function mapIX(lp){return insetX+pad+((lp-srcLogMin)/(srcLogMax-srcLogMin))*(insetW-2*pad);}
function mapIY(ov){return insetY+16+((srcYMax-ov)/(srcYMax-srcYMin))*(insetH-32);}
[51,52,53].forEach(v=>{
  svg += `<line x1="${insetX+pad}" x2="${insetX+insetW-pad}" y1="${mapIY(v)}" y2="${mapIY(v)}" stroke="rgba(0,0,0,0.06)" stroke-dasharray="2 3"/>`;
});

// Inset markers + labels
const zoomData = data.filter(d => d.logp>=1.38 && d.logp<=1.58 && d.overall>=50 && d.overall<=54.5);
zoomData.forEach(d => {
  const cx=mapIX(d.logp), cy=mapIY(d.overall);
  const s=6.5;
  if (d.category === "textonly") {
    svg += `<circle cx="${cx}" cy="${cy}" r="${s}" fill="${d.color}" stroke="rgba(0,0,0,0.2)" stroke-width="1" opacity="0.8"/>`;
  } else if (d.category === "blackbox") {
    svg += `<path d="${trianglePath(cx,cy,s)}" fill="${d.color}" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-linejoin="round" opacity="0.92"/>`;
  } else if (d.category === "adaptive") {
    svg += `<path d="${diamondPath(cx,cy,s)}" fill="${d.color}" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-linejoin="round" opacity="0.92"/>`;
  } else if (d.category === "self") {
    svg += `<path d="${hexagonPath(cx,cy,s)}" fill="${d.color}" stroke="#1a1a2e" stroke-width="2.5" stroke-linejoin="round" opacity="0.92"/>`;
  } else {
    svg += `<path d="${squarePath(cx,cy,s)}" fill="${d.color}" stroke="rgba(0,0,0,0.15)" stroke-width="1" opacity="0.92"/>`;
  }
  const zo = zoomOffsets[d.name] || {dx:10,dy:0,anchor:"start"};
  const displayName = d.name.replace(" (text-only)","");
  const fc = "#3a4a5e";
  svg += `<text x="${cx+zo.dx}" y="${cy+zo.dy}" text-anchor="${zo.anchor}" dominant-baseline="middle" fill="${fc}" font-size="12" font-weight="600">${displayName}</text>`;
});

// ── Legend (foreignObject) ───────────────────────────────────────────────────
const lx = toX(logMax) - 220;
const ly = toY(15) - 170;
svg += `<foreignObject x="${lx}" y="${ly}" width="214" height="170">
<div xmlns="http://www.w3.org/1999/xhtml" style="background:rgba(248,249,252,0.92);border-radius:6px;border:1px solid rgba(0,0,0,0.08);padding:10px 12px;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;gap:6px;">
  <span style="color:#3a4a5e;font-size:13px;font-weight:700;margin-bottom:2px;">System Type</span>
  <div style="display:flex;align-items:center;gap:6px;">
    <svg width="14" height="14"><polygon points="7,1 12,3.9 12,10.1 7,13 2,10.1 2,3.9" fill="#6aaa8a" stroke="#1a1a2e" stroke-width="2" stroke-linejoin="round"/></svg>
    <span style="color:#3a4a5e;font-size:12px;font-weight:600;line-height:1.2;">Self-Regulated Agentic LLM</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <svg width="14" height="14"><polygon points="7,0 14,7 7,14 0,7" fill="#6aaa8a" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-linejoin="round"/></svg>
    <span style="color:#3a4a5e;font-size:12px;font-weight:600;line-height:1.2;">Adaptive Agentic LLM</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <svg width="14" height="14"><polygon points="7,1 13,13 1,13" fill="#6aaa8a" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-linejoin="round"/></svg>
    <span style="color:#3a4a5e;font-size:12px;font-weight:600;line-height:1.2;">Black-Box Agentic LLM</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <svg width="14" height="14"><rect x="1" y="1" width="12" height="12" fill="#6aaa8a" stroke="rgba(0,0,0,0.15)" stroke-width="1"/></svg>
    <span style="color:#3a4a5e;font-size:12px;font-weight:600;line-height:1.2;">LLM + Tools</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#6aaa8a" stroke="rgba(0,0,0,0.2)" stroke-width="1"/></svg>
    <span style="color:#3a4a5e;font-size:12px;font-weight:600;line-height:1.2;">Reasoning LLM</span>
  </div>
</div>
</foreignObject>`;

svg += `</svg>`;

// ── Build page ───────────────────────────────────────────────────────────────
const container = document.createElement("div");
container.style.cssText = "display:flex;flex-direction:column;align-items:center;width:1020px;";

// Title
const h2 = document.createElement("h2");
h2.textContent = "Overall Pass@1 (\u2191) vs. Parameter Size (log scale)";
h2.style.cssText = "color:#1a1a2e;font-weight:800;font-size:20px;margin-bottom:2px;letter-spacing:-0.02em;font-family:'DM Sans',sans-serif;";
container.appendChild(h2);

// Subtitle
const sub = document.createElement("p");
sub.textContent = "Color encodes reasoning token count \u2014 greener is fewer, redder is more";
sub.style.cssText = "color:#4a5a6e;font-size:14px;margin-bottom:4px;font-weight:500;font-family:'DM Sans',sans-serif;";
container.appendChild(sub);

// Color legend
const cbar = document.createElement("div");
cbar.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:8px;";
const rlabel = document.createElement("span");
rlabel.textContent = "Num. Reasoning Tokens (\u2193)";
rlabel.style.cssText = "color:#5a6a7e;font-size:12px;font-weight:600;";
cbar.appendChild(rlabel);
tokenBins.forEach(bin => {
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;align-items:center;gap:5px;";
  const sw = document.createElementNS("http://www.w3.org/2000/svg","svg");
  sw.setAttribute("width","24"); sw.setAttribute("height","14");
  const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("width","24"); r.setAttribute("height","14"); r.setAttribute("rx","3");
  r.setAttribute("fill",bin.color); r.setAttribute("opacity","0.9");
  sw.appendChild(r); wrap.appendChild(sw);
  const lbl = document.createElement("span");
  lbl.textContent = bin.label;
  lbl.style.cssText = "color:#3a4a5e;font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;";
  wrap.appendChild(lbl); cbar.appendChild(wrap);
});
container.appendChild(cbar);

// SVG chart
const chartDiv = document.createElement("div");
chartDiv.innerHTML = svg;
container.appendChild(chartDiv);

document.body.appendChild(container);
</script>
</body>
